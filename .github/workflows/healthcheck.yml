name: Application Health Guardian

on:
  # Roda a cada 15 minutos
  schedule:
    - cron: '*/15 * * * *'
  # Roda automaticamente sempre que houver um git push alterando o services.json ou o script
  push:
    branches:
      - main
  # Permite rodar manualmente pelo painel do GitHub
  workflow_dispatch:

permissions:
  contents: write

jobs:
  health-check:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar o Python no Runner
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Executar o Health Check e Gerar Dashboard
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python health_check.py

      - name: Commit e Push das alterações no index.html
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "chore: atualiza status page automatica [skip ci]" || exit 0
          git push
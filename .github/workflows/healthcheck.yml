name: Application Health Guardian

on:
  # Agendamento automático a cada 15 minutos (Cron)
  schedule:
    - cron: '*/15 * * * *'
  # Permite disparar manualmente pela interface do GitHub para testes rápidos
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar o Python no Runner
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Executar o Health Check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python health_check.py